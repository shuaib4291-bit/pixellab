<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Pixellab</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#1e1e1e;color:#fff;font-family:sans-serif}
#top{display:flex;gap:6px;padding:8px;flex-wrap:wrap}
button,select{padding:8px 10px;border:0;border-radius:6px;background:#3a7bd5;color:#fff;font-size:14px}
#wrap{padding:6px;text-align:center}
canvas{max-width:100%;max-height:50vh;background:#fff;touch-action:none}
#ctl{padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
#ctl input[type=text]{grid-column:1/3;padding:10px;font-size:16px;border-radius:6px;border:0}
label{font-size:13px;display:flex;align-items:center;gap:6px}
input[type=range]{flex:1}
</style>
</head>
<body>
<div id="top">
<button onclick="f.click()">ছবি</button>
<button onclick="addT()">+ লেখা</button>
<button onclick="del()" style="background:#c0392b">মুছুন</button>
<button onclick="save()" style="background:#27ae60">সেভ</button>
<input type="file" id="f" accept="image/*" hidden>
</div>
<div id="wrap"><canvas id="c" width="1080" height="1080"></canvas></div>
<div id="ctl">
<input type="text" id="tx" placeholder="এখানে লিখুন">
<label>সাইজ <input type="range" id="sz" min="20" max="300" value="90"></label>
<label>ফন্ট <select id="ft">
<option>sans-serif</option><option>serif</option>
<option>monospace</option><option>cursive</option>
</select></label>
<label>রং <input type="color" id="cl" value="#ffffff"></label>
<label>আউটলাইন <input type="color" id="sc" value="#000000"></label>
<label>মোটা <input type="checkbox" id="bd" checked></label>
<label>আউটলাইন সাইজ <input type="range" id="sw" min="0" max="20" value="4"></label>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let img=null,T=[],sel=null,dx=0,dy=0,drag=false;
const $=id=>document.getElementById(id);
function draw(out){
x.clearRect(0,0,c.width,c.height);
x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
if(img)x.drawImage(img,0,0,c.width,c.height);
T.forEach(t=>{
x.font=(t.b?'bold ':'')+t.s+'px '+t.f;
x.textAlign='center';x.textBaseline='middle';
if(t.w){x.lineWidth=t.w;x.strokeStyle=t.sc;x.lineJoin='round';x.strokeText(t.t,t.x,t.y)}
x.fillStyle=t.c;x.fillText(t.t,t.x,t.y);
if(!out&&t===sel){
const w=x.measureText(t.t).width;
x.strokeStyle='#3a7bd5';x.lineWidth=3;x.setLineDash([10,8]);
x.strokeRect(t.x-w/2-10,t.y-t.s/2-10,w+20,t.s+20);x.setLineDash([]);
}
});
}
function addT(){
sel={t:$('tx').value||'লেখা',x:c.width/2,y:c.height/2,s:+$('sz').value,c:$('cl').value,sc:$('sc').value,f:$('ft').value,b:$('bd').checked,w:+$('sw').value};
T.push(sel);draw();
}
function upd(){
if(!sel)return;
sel.t=$('tx').value||' ';sel.s=+$('sz').value;sel.c=$('cl').value;
sel.sc=$('sc').value;sel.f=$('ft').value;sel.b=$('bd').checked;sel.w=+$('sw').value;
draw();
}
['tx','sz','cl','sc','ft','bd','sw'].forEach(i=>{$(i).addEventListener('input',upd);$(i).addEventListener('change',upd)});
function del(){if(sel){T=T.filter(t=>t!==sel);sel=null;draw()}}
function pos(e){
const r=c.getBoundingClientRect();
return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height};
}
c.addEventListener('pointerdown',e=>{
const p=pos(e);sel=null;
for(let i=T.length-1;i>=0;i--){
const t=T[i];x.font=(t.b?'bold ':'')+t.s+'px '+t.f;
const w=x.measureText(t.t).width;
if(Math.abs(p.x-t.x)<w/2+20&&Math.abs(p.y-t.y)<t.s/2+20){
sel=t;dx=p.x-t.x;dy=p.y-t.y;drag=true;
$('tx').value=t.t;$('sz').value=t.s;$('cl').value=t.c;
$('sc').value=t.sc;$('ft').value=t.f;$('bd').checked=t.b;$('sw').value=t.w;
break;
}
}
draw();
});
c.addEventListener('pointermove',e=>{
if(!drag||!sel)return;
const p=pos(e);sel.x=p.x-dx;sel.y=p.y-dy;draw();
});
addEventListener('pointerup',()=>drag=false);
$('f').onchange=e=>{
const fl=e.target.files[0];if(!fl)return;
const im=new Image();
im.onload=()=>{
img=im;const m=1080/Math.max(im.width,im.height);
c.width=Math.round(im.width*m);c.height=Math.round(im.height*m);
draw();
};
im.src=URL.createObjectURL(fl);
};
function save(){
sel=null;draw(true);
const a=document.createElement('a');
a.download='pixellab_'+Date.now()+'.png';
a.href=c.toDataURL('image/png');a.click();
}
draw();
</script>
</body>
</html>
